# 以物易物資料庫 (Barter Database)
###########################################################################
#
# 以物易物設定
#
###########################################################################
#  - Name               NPC 名稱。
#    Map                地圖名稱。（預設：不在此地圖上）
#    X                  地圖 X 座標。（預設：0）
#    Y                  地圖 Y 座標。（預設：0）
#    Direction          NPC 面向的方向。（預設：北方 / North）
#    Sprite             NPC 的圖檔 (Sprite) 名稱。（預設：FakeNpc）
#    Items:             販售的道具列表。
#      - Index          該道具在商店內的索引編號。(0-...)
#                       最大索引上限取決於客戶端 (Client)。
#        Item           道具的 Aegis 名稱。
#        Stock          道具的庫存數量。0 表示無限。（預設：0）
#        Zeny           購買該道具所需的 Zeny 費用。（預設：0）
#        Refine         該道具的精煉等級。（預設：0）
#        RequiredItems: 所需的（等價交換）道具列表（選填）
#          - Index      所需道具的索引編號。(0-4)
#            Item       所需道具的 Aegis 名稱。
#            Amount     所需道具的數量。（預設：1）
#            Refine     所需道具的精煉等級。（預設：0）
###########################################################################

